{% extends "home/base.html" %}
{% load static %}

{% block content %}

    <main>
        <article>

             <!--Hero section-->
             <section class="section hero has-bg-image" aria-label="hero" style="background-image:url({% static 'home/IMAGES/hero-bg.jpg' %})">
                <div class="container">
                    <div class="hero-content">
                        <p class="hero-subtitle">
                            Explore the world
                            <img src="{% static 'home/IMAGES/title-icon.svg' %}" width="20" height="20" alt="world icon" class="img"> 
                        </p>
                        <h1 class="h1 title hero-title">
                            It’s a Big World Out There, Go Explore
                        </h1>
                        <p class="hero-text">
                            We always make our customer happy by providing as many choices as possible
                        </p>
                        <div class="wrapper">
                            <a href="{% url 'booking' %}" class="btn btn-secondary">
                                <span class="span">Plan a Trip</span>
                                <ion-icon name="chevron-forward" aria-hidden="true"></ion-icon>
                            </a>
                        </div>
                    </div> 
                    <figure class="hero-banner">
                        <img src="{% static 'home/IMAGES/planning.jpg' %}" width="631" height="735" alt="hero banner" class="w-100">
                    </figure>  
                </div>   
            </section> 


        </article> 
    </main> 

{% endblock content %}
