{% extends "home/after_login_base.html" %}
{% block content %}

    <style>
        .cancel 
        {
            margin-inline: auto;
            margin-top: 20rem;
        }
        .cancel form textarea
        {
            padding: 1rem 2rem;
            width: 60vw;
            border: 1px solid rgb(217, 216, 216);
            border-radius: 30px;
            margin-inline-start: 5rem;
            height: 150px;
            width: 90%;
        }
    </style>

    <!--UPI-->
    <section class="section signin login cancel">
        <div class="container">
            <form action='{% url "cancellation" %}' method="post">
                {% csrf_token %}                
                {{form.as_p}}
                <div class="btn-container">
                    <input type="submit" class="btn btn-secondary" value="CANCEL">
                    <input type="reset" class="btn btn-secondary" value="RESET">
                </div>
            </form>
        </div>
    </section>

{% endblock content %}
