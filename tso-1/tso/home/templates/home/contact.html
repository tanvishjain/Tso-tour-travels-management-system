{% extends "home/base.html" %}
{% load static %}
{% block content %}

    <style>
        .contact
        {
            margin-block-start: 15rem;
        }
    .contact .container
    {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 5rem;
    }

    .contact form textarea
    {
        padding: 1rem 2rem;
        width: 60vw;
        border: 1px solid rgb(217, 216, 216);
        border-radius: 30px;
        margin-block-end: 1rem;
        margin-inline-start: 3rem;
        height: 200px;
    }

    .contact input,
    .contact select
    {
        padding: 1rem 2rem;
        width: 60vw;
        border: 1px solid rgb(217, 216, 216);
        border-radius: 200px;
        margin-block-end: 1rem;
        margin-inline-start: 3rem;
        height: 50%;
    }

    .contact .title-wrapper
    {
        grid-column: auto;
        margin-inline-start: 20rem;
        margin-block-start: -20rem;
    }

    .contact .container .contact-detail
    {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 2rem;
    }

    .contact .icon
    {
        color: var(--bg-english-vermillion);
        margin-block-start: 2rem;
        font-size: var(--fontSize-6);
    }

    .contact-detail
    {
        display: flex;
        flex-direction: row;
        justify-content: center;
        align-items: center;
        gap: 1rem;
        margin-inline-start: 2rem;
    }

    .contact-detail .text
    {
        font-size: var(--fontSize-7);
    }

    .contact-detail .address-detail,
    .contact-detail .phone-detail,
    .contact-detail .email-detail
    {
        border-radius: var(--radius-30);
        -webkit-border-radius: var(--radius-30);
        -moz-border-radius: var(--radius-30);
        -ms-border-radius: var(--radius-30);
        -o-border-radius: var(--radius-30);
        text-align: center;
        padding-inline: 3rem;
        padding-block-end: 2rem;
        width: 80%;
    }

    .contact-detail .address-detail
    {
        background-color: var(--bg-chrome-yellow-alpha-5);
    }

    .contact-detail .phone-detail
    {
        background-color: var(--bg-red-salsa-alpha-5);
        height: 150px;
        padding-block-start: 3rem;
    }

    .contact-detail .email-detail
    {
        background-color: var(--bg-majorelle-blue-alpha-5);
        height: 150px;
        padding-block-start: 3rem;
    }

    .contact-form .btn-container
    {
        margin-block-start: 3rem;
    }

    @media (min-width: 575px)
    {
        /**
            *CONTACT US
        */
        .contact-form
        {
            margin-inline: auto;
        }

        .contact-form input
        {
            width: 60vw;
        }

        .contact-detail .address-detail,
        .contact-detail .phone-detail,
        .contact-detail .email-detail
        {
            width: 100%;
            height: 130px;
            padding-block-start: 1rem;
            font-size: var(--fontSize-3);
        }
    }
    @media (min-width: 768px)
    {
        /**
            *CONTACT US
        */
        .contact .container
        {
            gap: 5rem;
        }
        .contact-form
        {
            margin-inline: auto;
        }

        .contact-detail .address-detail,
        .contact-detail .phone-detail,
        .contact-detail .email-detail
        {
            width: 600px;
        }
    
        .contact-form input
        {
            width: 65vw;
        }

        .contact-form .btn-container
        {
            margin-block-start: -5rem;
        }
    }
    @media (min-width: 992px)
    {
        /* CONTACT US  */
        .contact-form
        {
        margin-inline-start: 5rem;
        font-size: var(--fontSize-5);
        }
    
        .contact-detail .text
        {
        font-size: var(--fontSize-6);
        }
    }
    @media (min-width: 1400px)
    {
        /**
        *CONTACT US
        */
        .contact
        {
            margin-block-start: 35rem;
        }
        .contact .title-wrapper
        {
            margin-inline: auto;
        }
        .contact .container
        {
            margin-block-start: -10rem;
            gap: 5rem;
            flex-direction: row;
        }
        .contact .container .contact-detail
        {
            gap: 15rem;
        }
        .contact-form
        {
            width: 40vw;
        }
        .contact form textarea
        {
            width: 35vw;
        }
        .contact input,
        .contact select
        {
            width: 35vw;
        }
    }
    </style>

    <!--CONTACT US-->  
    <main>     
        <article>     
            <section class="section contact desti" id="contact" aria-label="contact">
                <div class="title-wrapper">
                    <h2 class="h2 title section-title">Want to Contact Us</h2>
                </div>
                <div class="container">
                    <div class="contact-detail-container">
                        <div class="contact-detail">
                            <div class="address-detail">
                                <div class="icon"><i class="fa fa-map-marker" aria-hidden="true"></i></div>
                                <div class="text">
                                    <p class="contact-text">A201 Sugar Camp Road, Ahmedabad, Gujarat, 123456</p>
                                </div>
                            </div>
                            <div class="phone-detail">
                                <div class="icon"><i class="fa fa-phone" aria-hidden="true"></i></div>
                                <div class="text">
                                    <p class="h4">+91 9876543217</p>
                                </div>
                            </div>
                            <div class="email-detail">
                                <div class="icon"><i class="fa fa-envelope" aria-hidden="true"></i></div>
                                <div class="text">
                                    <p class="h4">tsotravel1234@gmail.com</p>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="contact-form signin form-container">
                        <form action="#" method="post">
                            {% csrf_token %}
                            {{form.as_p}}
                            <div class="btn-container">
                                <input type="submit" class="btn btn-secondary" value="SUBMIT">
                                <input type="reset" class="btn btn-secondary" value="RESET">
                            </div>
                        </form> 
                    </div>
                </div>
            </section>
        </article>
    </main> 

{% endblock content %}
